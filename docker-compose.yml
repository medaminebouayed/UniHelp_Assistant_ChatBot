version: "3.9"

x-postgres-common: &postgres-common
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password1234}
  POSTGRES_DB: ${POSTGRES_DB:-graphrag}

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password1234@postgres:5432/graphrag}
  SECRET_KEY: ${SECRET_KEY:-changez-moi-en-production}
  RAG_API_URL: ${RAG_API_URL:-http://rag-api:8002}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3-32b}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@unihelp.tn}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-UniHelp}
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DATABASE: ${POSTGRES_DB:-graphrag}
  PG_USER: ${POSTGRES_USER:-postgres}
  PG_PASSWORD: ${POSTGRES_PASSWORD:-password1234}
  NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}

services:
  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      <<: *postgres-common
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j (Knowledge Graph) ──────────────────────────
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "PASSWORD=$$(echo \"$$NEO4J_AUTH\" | cut -d/ -f2); cypher-shell -u neo4j -p \"$$PASSWORD\" \"RETURN 1\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Ollama (Local LLM) ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── RAG API Microservice ────────────────────────────
  rag-api:
    build:
      context: ./RAG Core
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      <<: *backend-env
      RAG_API_PORT: "8002"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - rag_data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    # ── GPU support (uncomment for NVIDIA GPU acceleration) ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── Backend API ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    volumes:
      - backend_uploads:/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rag-api:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Frontend (Angular + nginx) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  neo4j_data:
  rag_data:
  huggingface_cache:
  ollama_data:
  backend_uploads:
